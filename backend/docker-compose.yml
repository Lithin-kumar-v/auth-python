version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/health-probe-demo.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    # optional: keep restart policy in dev
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2511
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
